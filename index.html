<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OHAYOH — 가이드 허브</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --brand:#C89478;
  --brand-dark:#3E2C22;
  --brand-light:#F3E1D6;
  --bg:#FBF7F3;
  --ink:#2A2119; --gray:#8A7A70; --white:#fff;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-tap-highlight-color:transparent;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding-bottom:72px}

/* GATE */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--ink) 0%,var(--brand-dark) 55%,var(--brand) 120%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.gate-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:40px 28px;max-width:340px;width:100%;text-align:center;backdrop-filter:blur(6px)}
.gate-box .g-badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:100px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:6px 16px;margin-bottom:18px}
.gate-box h1{color:#fff;font-size:24px;font-weight:900;margin-bottom:8px;letter-spacing:.02em}
.gate-box p{color:rgba(255,255,255,.75);font-size:13px;margin-bottom:22px}
.gate-box input{width:100%;text-align:center;letter-spacing:.4em;font-size:20px;font-family:var(--mono);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:14px;color:#fff;margin-bottom:12px}
.gate-box input::placeholder{color:rgba(255,255,255,.35);letter-spacing:.3em;font-size:14px}
.gate-box button{width:100%;background:#fff;color:var(--brand-dark);border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:800;cursor:pointer}
.gate-err{color:#FFD3C4;font-size:12px;margin-top:12px;min-height:16px}

/* HUB CONTENT */
#hub{display:none}
.hub-hero{background:linear-gradient(135deg,var(--ink) 0%,var(--brand-dark) 60%,var(--brand) 100%);color:#fff;padding:56px 24px 44px;text-align:center}
.hub-hero .badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:100px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:6px 16px;margin-bottom:18px}
.hub-hero h1{font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:.02em}
.hub-hero p{font-size:13px;opacity:.85;margin-top:8px;letter-spacing:.06em}

.hub-list{padding:32px 24px;display:flex;flex-direction:column;gap:12px}
.hub-card{display:flex;align-items:center;justify-content:space-between;background:var(--white);border:1px solid rgba(42,33,25,.1);border-radius:16px;padding:20px 22px;text-decoration:none;color:var(--ink)}
.hub-card .h-left{display:flex;align-items:center;gap:14px}
.hub-card .h-num{font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;background:var(--brand);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.hub-card .h-title{font-size:16px;font-weight:800}
.hub-card .h-sub{font-size:12px;color:var(--gray);margin-top:2px}
.hub-card .arrow{color:var(--brand);font-weight:900;font-size:18px}

.hub-footer{text-align:center;font-size:22px;font-weight:900;letter-spacing:.14em;color:var(--brand-dark);opacity:.4;margin-top:20px}
</style>
</head>
<body>

  <!-- ░░ PASSWORD GATE ░░ -->
  <div id="gate">
    <div class="gate-box">
      <div class="g-badge">OHAYOH GUIDE HUB</div>
      <h1>비밀번호 확인</h1>
      <p>담당자에게 전달받은 비밀번호를 입력해주세요.</p>
      <input type="password" id="pw" inputmode="numeric" maxlength="4" placeholder="••••" />
      <button id="pwBtn">입장하기</button>
      <div class="gate-err" id="pwErr"></div>
    </div>
  </div>

  <!-- ░░ HUB ░░ -->
  <div id="hub">
    <div class="wrap">
      <div class="hub-hero">
        <div class="badge">GUIDE HUB</div>
        <h1>오헤이오 가이드 허브</h1>
        <p>OHAYOH × CREATOR CAMPAIGN</p>
      </div>
      <div class="hub-list">
        <a class="hub-card" href="a-type.html">
          <div class="h-left"><div class="h-num">A</div><div><div class="h-title">A Type</div><div class="h-sub">임시 제목 · 크리에이터 가이드</div></div></div>
          <span class="arrow">→</span>
        </a>
        <a class="hub-card" href="b-type.html">
          <div class="h-left"><div class="h-num">B</div><div><div class="h-title">B Type</div><div class="h-sub">임시 제목 · 크리에이터 가이드</div></div></div>
          <span class="arrow">→</span>
        </a>
        <a class="hub-card" href="c-type.html">
          <div class="h-left"><div class="h-num">C</div><div><div class="h-title">C Type</div><div class="h-sub">임시 제목 · 크리에이터 가이드</div></div></div>
          <span class="arrow">→</span>
        </a>
        <a class="hub-card" href="d-type.html">
          <div class="h-left"><div class="h-num">D</div><div><div class="h-title">D Type</div><div class="h-sub">임시 제목 · 크리에이터 가이드</div></div></div>
          <span class="arrow">→</span>
        </a>
        <a class="hub-card" href="e-type.html">
          <div class="h-left"><div class="h-num">E</div><div><div class="h-title">E Type</div><div class="h-sub">임시 제목 · 크리에이터 가이드</div></div></div>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="hub-footer">OHAYOH</div>
    </div>
  </div>

<script>
const PASSWORD = '0907';
const gate = document.getElementById('gate');
const hub = document.getElementById('hub');
const pwInput = document.getElementById('pw');
const pwBtn = document.getElementById('pwBtn');
const pwErr = document.getElementById('pwErr');

function unlock(){
  gate.style.display = 'none';
  hub.style.display = 'block';
  sessionStorage.setItem('ohayoh_hub_ok', '1');
}

function tryUnlock(){
  if (pwInput.value.trim() === PASSWORD){
    unlock();
  } else {
    pwErr.textContent = '비밀번호가 올바르지 않습니다.';
    pwInput.value = '';
    pwInput.focus();
  }
}

if (sessionStorage.getItem('ohayoh_hub_ok') === '1'){
  unlock();
}

pwBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });
pwInput.focus();
</script>
</body>
</html>
